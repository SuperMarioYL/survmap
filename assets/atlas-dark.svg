<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Survmap 架构：session.jsonl → 解析器 → 归因核心 → go-git blame → 渲染器，repo at HEAD 喂入归因核心">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>
  <text x="440" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#A1A1A8">一个二进制 · 三个进程内模块 · 不依赖宿主 git CLI</text>

  <!-- static connectors -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="190" y1="180" x2="240" y2="180" marker-end="url(#ah-d)"/>
    <line x1="410" y1="180" x2="460" y2="180" marker-end="url(#ah-d)"/>
    <line x1="630" y1="180" x2="680" y2="180" marker-end="url(#ah-d)"/>
    <line x1="325" y1="250" x2="325" y2="220" marker-end="url(#ah-d)"/>
  </g>

  <!-- marching dashes (data flow) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="190" y1="180" x2="236" y2="180" stroke="#4DA3FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="410" y1="180" x2="456" y2="180" stroke="#8985FF" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="630" y1="180" x2="676" y2="180" stroke="#2DC79A" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="325" y1="250" x2="325" y2="224" stroke="#A1A1A8" stroke-opacity="0.55" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- packet dots -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M190,180 L236,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M410,180 L456,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M630,180 L676,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#A1A1A8">
      <animateMotion path="M325,250 L325,224" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes -->
  <g>
    <rect x="20" y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="105" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">Session parser</text>
    <text x="105" y="192" text-anchor="middle" font-size="11" fill="#6FB8FF">JSONL → []Turn</text>

    <rect x="240" y="140" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="325" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#8985FF">Attribution core</text>
    <text x="325" y="192" text-anchor="middle" font-size="11" fill="#9F9CFF">turn → HEAD survival</text>

    <rect x="460" y="140" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="545" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#2DC79A">go-git blame</text>
    <text x="545" y="192" text-anchor="middle" font-size="11" fill="#54D8B0">oracle = HEAD</text>

    <rect x="680" y="140" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="765" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#4DA3FF">Renderer</text>
    <text x="765" y="192" text-anchor="middle" font-size="11" fill="#6FB8FF">TUI / HTML</text>

    <rect x="240" y="250" width="170" height="46" rx="12" fill="#A1A1A8" fill-opacity="0.16" stroke="#A1A1A8" stroke-width="1.5"/>
    <text x="325" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#A1A1A8">repo at HEAD (git)</text>
  </g>
</svg>
